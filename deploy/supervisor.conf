; MindEase queue worker (password-reset emails). Placeholders filled by server-setup.sh
[program:mindease-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP__/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=__USER__
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=__APP__/storage/logs/worker.log
